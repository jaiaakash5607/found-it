<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 — Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --bg: #020617;
      --card-bg: #0b1120;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --shadow: 0 22px 55px rgba(0, 0, 0, 0.7);
      --radius: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(129, 140, 248, 0.25) 0, transparent 55%),
        radial-gradient(circle at bottom, rgba(56, 189, 248, 0.18) 0, transparent 55%),
        var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 560px;
      width: 100%;
      background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.16), transparent 60%) ,
                  radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.98));
      border-radius: var(--radius);
      padding: 36px 32px 32px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #f97316;
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.7);
    }

    .code {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--primary);
      text-shadow: 0 0 24px rgba(129, 140, 248, 0.9);
    }

    .title {
      margin-top: 6px;
      font-size: 1.7rem;
      font-weight: 700;
    }

    .message {
      margin-top: 12px;
      font-size: 0.98rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .actions {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 22px;
      border-radius: 999px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .btn-primary {
      background: var(--primary-dark);
      color: #0b1120;
      box-shadow: 0 0 22px rgba(129, 140, 248, 0.75);
    }

    .btn-primary:hover {
      background: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 0 30px rgba(129, 140, 248, 1);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.7);
    }

    .btn-ghost:hover {
      color: var(--text-main);
      background: rgba(15, 23, 42, 0.7);
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      .container {
        padding-inline: 20px;
      }
      .code {
        font-size: 3.6rem;
      }
      .title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Oops! Lost in the campus</span>
    </div>

    <div class="code">404</div>
    <h1 class="title">Page Not Found</h1>

    <p class="message">
      The page you are looking for doesn’t exist, was moved, or never enrolled this semester.<br>
      Let’s get you back to a familiar hallway.
    </p>

    <div class="actions">
      <!-- Replace href with your real home/dashboard routes -->
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/browse" class="btn btn-ghost">Browse Items</a>
    </div>

    <p class="hint">
      Error code: <strong>SRM-404</strong> • If this keeps happening, contact support.
    </p>
  </main>

</body>
</html>
