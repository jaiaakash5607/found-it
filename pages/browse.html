<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browse Lost & Found Items — SRMIST</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --bg: #0f0f14;
      --bg-elevated: #15151f;
      --card-bg: #181824;
      --border: #2a2a3a;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --input-bg: #111119;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.55);
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 45%, #020617 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    a { text-decoration: none; color: inherit; }

    /* NAVBAR */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 7%;
      background: rgba(10, 10, 18, 0.96);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav-brand {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--primary);
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 0.95rem;
    }

    .btn-nav {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 600;
      transition: 0.18s ease;
      background: transparent;
    }

    .btn-nav.login {
      color: var(--text-main);
      border-color: transparent;
    }

    .btn-nav.login:hover {
      border-color: rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.7);
    }

    .btn-nav.signup {
      background: var(--primary-dark);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(129, 140, 248, 0.55);
    }

    .btn-nav.signup:hover {
      background: var(--primary);
      box-shadow: 0 0 24px rgba(129, 140, 248, 0.8);
      transform: translateY(-1px);
    }

    /* PAGE LAYOUT */
    .page {
      max-width: 1120px;
      margin: 38px auto 60px;
      padding: 0 7%;
    }

    .page-header {
      margin-bottom: 26px;
    }

    .page-title {
      font-size: clamp(2rem, 3vw, 2.6rem);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 1.02rem;
      color: var(--text-muted);
    }

    /* FILTER CARD */
    .filter-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.92));
      border-radius: var(--radius-lg);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: var(--shadow-soft);
      padding: 20px 22px 24px;
      margin-bottom: 26px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 18px;
      align-items: flex-start;
    }

    .filter-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #e5e7eb;
    }

    .filter-input,
    .filter-select {
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: var(--input-bg);
      color: var(--text-main);
      padding: 11px 16px;
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      appearance: none;
    }

    .filter-input::placeholder {
      color: #6b7280;
    }

    .filter-input:focus,
    .filter-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.7);
      background: #050814;
    }

    .filter-select {
      padding-right: 40px;
      background-image: linear-gradient(45deg, transparent 50%, #9ca3af 50%),
                        linear-gradient(135deg, #9ca3af 50%, transparent 50%);
      background-position: calc(100% - 14px) 54%, calc(100% - 9px) 54%;
      background-size: 7px 7px, 7px 7px;
      background-repeat: no-repeat;
    }

    /* RESULTS CARD */
    .results-card {
      background: rgba(15, 23, 42, 0.95);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(55, 65, 81, 0.9);
      box-shadow: var(--shadow-soft);
      min-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 18px;
    }

    .empty-text {
      font-size: 0.98rem;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-text span {
      color: var(--primary);
      font-weight: 500;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .navbar {
        padding-inline: 5%;
      }

      .page {
        padding-inline: 5%;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .filter-card {
        padding-inline: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-brand">SRMIST Lost &amp; Found</div>
    <div class="nav-actions">
      <button class="btn-nav login" id="loginBtn">Log In</button>
      <button class="btn-nav signup" id="signupBtn">Sign Up</button>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="page">
    <!-- Header -->
    <section class="page-header">
      <h1 class="page-title">Browse Lost &amp; Found Items</h1>
      <p class="page-subtitle">Search and filter through all active listings</p>
    </section>

    <!-- Filters -->
    <section class="filter-card">
      <div class="filter-grid">
        <div class="filter-group">
          <label for="searchInput">Search</label>
          <input
            id="searchInput"
            class="filter-input"
            type="text"
            placeholder="Search items..."
          />
        </div>

        <div class="filter-group">
          <label for="typeSelect">Type</label>
          <select id="typeSelect" class="filter-select">
            <option value="all">All Types</option>
            <option value="lost">Lost</option>
            <option value="found">Found</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="categorySelect">Category</label>
          <select id="categorySelect" class="filter-select">
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="documents">Documents</option>
            <option value="clothing">Clothing</option>
            <option value="accessories">Accessories</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Results / Empty State -->
    <section class="results-card">
      <p class="empty-text" id="emptyText">
        No items found matching your criteria.
      </p>
    </section>
  </main>

  <!-- JS -->
  <script>
    const searchInput = document.getElementById('searchInput');
    const typeSelect = document.getElementById('typeSelect');
    const categorySelect = document.getElementById('categorySelect');
    const emptyText = document.getElementById('emptyText');

    function updateEmptyMessage() {
      const term = searchInput.value.trim();
      const type = typeSelect.value;
      const category = categorySelect.value;

      let msg = 'No items found matching your criteria.';

      const parts = [];

      if (term) parts.push(`search term <span>"${term}"</span>`);
      if (type !== 'all') parts.push(`type <span>${type}</span>`);
      if (category !== 'all') parts.push(`category <span>${category}</span>`);

      if (parts.length) {
        msg = `No items found for ${parts.join(' & ')}.`;
      }

      emptyText.innerHTML = msg;
    }

    searchInput.addEventListener('input', updateEmptyMessage);
    typeSelect.addEventListener('change', updateEmptyMessage);
    categorySelect.addEventListener('change', updateEmptyMessage);

    document.getElementById('loginBtn').onclick = () => alert('Navigate to /login');
    document.getElementById('signupBtn').onclick = () => alert('Navigate to /signup');
  </script>
</body>
</html>
