<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In — SRMIST Lost & Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

/* NAVBAR (same as homepage) */
.navbar {
  width: 100%;
  padding: 18px 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(15, 23, 42, 0.96);
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 20;
}

/* Left Side (Back + Title) */
.nav-left {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 1.45rem;
  font-weight: 700;
  color: #818cf8;
}

/* Back Button */
.back-btn {
  background: transparent;
  border: 1px solid rgba(129, 140, 248, 0.55);
  color: #cbd5e1;
  padding: 6px 12px;
  font-size: 0.95rem;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s ease;
}

.back-btn:hover {
  background: rgba(129, 140, 248, 0.15);
  border-color: #818cf8;
  color: white;
}


    :root {
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --bg: #0f0f14;
      --bg-card: #181820;
      --bg-input: #111118;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --border: #2a2a35;
      --radius: 14px;
      --error: #ef4444;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
  font-family: "Inter", sans-serif;
  background: radial-gradient(circle at top, #1f2937 0, #020617 50%);
  min-height: 100vh;
  color: var(--text-main);

  /* KEY PART: stack navbar on top, card below */
  display: flex;
  flex-direction: column;
  align-items: center;

  padding: 0 16px 40px; /* no big top padding now */
}


    .card {
  background: var(--bg-card);
  width: 100%;
  max-width: 460px;
  padding: 34px;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  margin-top: 80px; /* ⬅ space under navbar */
}


    .card-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .card-title {
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .card-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #e5e7eb;
    }

    .input {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-input);
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: 0.2s;
    }

    .input::placeholder {
      color: #6b7280;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.45);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .form-footer a {
      color: var(--primary);
      text-decoration: none;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius);
      background: var(--primary-dark);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: 0.2s ease;
      box-shadow: 0 0 22px rgba(129, 140, 248, 0.5);
    }

    .btn-submit:hover {
      background: var(--primary);
      box-shadow: 0 0 26px rgba(129, 140, 248, 0.8);
      transform: translateY(-2px);
    }

    .success {
      margin-top: 10px;
      text-align: center;
      color: #22c55e;
      font-size: 0.9rem;
      min-height: 18px;
    }

    .helper-text {
      margin-top: 14px;
      font-size: 0.9rem;
      text-align: center;
      color: var(--text-muted);
    }

    .helper-text a {
      color: var(--primary);
      font-weight: 600;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
<div class="navbar">
  <div class="nav-left">
    <button class="back-btn" onclick="history.back()">←</button>
   <a href="/" style="all:unset"> SRMIST Lost & Found</a>
  </div>
</div>

  
  <div class="card">
    <div class="card-header">
      <h1 class="card-title">Log In</h1>
      <p class="card-subtitle">Access your Lost & Found account</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>SRMIST Email</label>
        <input id="loginEmail" class="input" type="email" placeholder="your.name@srmist.edu.in">
        <div class="error-text" id="emailError"></div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input id="loginPassword" class="input" type="password" placeholder="••••••••">
        <div class="error-text" id="passwordError"></div>
      </div>

      <div class="form-footer">
        <div>
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>
        <a href="#">Forgot Password?</a>
      </div>

      <button class="btn-submit" type="submit">Log In</button>

      <div class="success" id="successMsg"></div>

      <p class="helper-text">
        Don’t have an account? <a href="/register">Create one</a>
      </p>
    </form>
  </div>

    const form = document.getElementById("loginForm");
    const successMsg = document.getElementById("successMsg");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      successMsg.textContent = "Logged in successfully!";
    });
  </script> -->

</body>
</html>
